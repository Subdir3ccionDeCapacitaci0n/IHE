<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Trámites | Estación de Atención</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style_avisos.css">
</head>
<body>

  <div class="main-container">
    <header class="panel-header">
      <div class="header-identidad">
        <div class="logo-box">
          <img src="logo2.jpeg" alt="Logotipo Institucional" class="logo">
        </div>
        <div class="header-titulos">
          <div class="header-meta">
            <span class="badge-en-vivo">
              <span class="dot-vivo" aria-hidden="true"></span>
              Sistema Activo en Tiempo Real
            </span>
            <span class="sub-area">Ventanilla de Atención Institucional</span>
          </div>
          <h1>PANEL DE TRÁMITES</h1>
        </div>
      </div>

      <div class="reloj-box" aria-label="Hora actual">
        <span class="reloj-label">HORA DEL SISTEMA</span>
        <div id="reloj">00:00:00</div>
      </div>
    </header>

    <main class="tabla-contenedor">
      <div class="grid-header" role="row">
        <span>TIPO DE TRÁMITE</span>
        <span>USUARIO</span>
        <span>ATENCIÓN</span>
        <span>HORA</span>
      </div>

      <ul id="listaAvisos" class="lista-avisos" aria-live="polite">
        <!-- Filas generadas dinámicamente por script_avisos.js -->
      </ul>

      <div id="status" class="status" role="status" aria-live="polite">
        Cargando registros...
      </div>
    </main>
  </div>

  <audio id="audioNotificacion" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <script src="script_avisos.js"></script>
</body>
</html>
